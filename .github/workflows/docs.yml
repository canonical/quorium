name: docs

on:
  pull_request:
    paths:
      - "documentation/**"
      - "examples/guestbook/**"
      - "examples/doc-snippets/**"
      - "xtask/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: documentation/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask docs-check
      - run: make -C documentation html spelling

  linkcheck:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: documentation/requirements.txt
      - run: make -C documentation linkcheck

  deploy:
    needs: check
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.DOCS_HOST != ''
    runs-on: ubuntu-latest
    environment: docs
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: documentation/requirements.txt
      - id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "names=${GITHUB_REF_NAME#v} stable" >> "$GITHUB_OUTPUT"
          else
            echo "names=latest" >> "$GITHUB_OUTPUT"
          fi
      - env:
          DOCS_DOMAIN: ${{ vars.DOCS_DOMAIN }}
          NAMES: ${{ steps.version.outputs.names }}
        run: |
          for name in $NAMES; do
            DOCS_VERSION="$name" \
            DOCS_BASE_URL="https://${DOCS_DOMAIN}/${name}/" \
            DOCS_URL_PREFIX="/${name}/" \
              make -C documentation html BUILD="_build/$name"
          done
      - env:
          SSH_KEY: ${{ secrets.DOCS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DOCS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/docs
          chmod 600 ~/.ssh/docs
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - env:
          DOCS_HOST: ${{ vars.DOCS_HOST }}
          DOCS_USER: ${{ vars.DOCS_USER }}
          DOCS_PORT: ${{ vars.DOCS_PORT || '22' }}
          NAMES: ${{ steps.version.outputs.names }}
        run: |
          for name in $NAMES; do
            rsync -rlz --delete --delay-updates \
              -e "ssh -i $HOME/.ssh/docs -p $DOCS_PORT -o IdentitiesOnly=yes" \
              "documentation/_build/$name/html/" "$DOCS_USER@$DOCS_HOST:$name/"
          done
